services:
  agent:
    build:
      context: ./agent
    container_name: gojo-agent
    restart: always
    stop_grace_period: 165s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
      GO_BACKEND_BASE_URL: ${GO_BACKEND_BASE_URL:-http://host.docker.internal:8080}
      AGENT_DEBUG: ${AGENT_DEBUG:-true}
      AGENT_LLM_TIMEOUT_SECONDS: ${AGENT_LLM_TIMEOUT_SECONDS:-120}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      MEMORY_COLLECTION: ${MEMORY_COLLECTION:-chat_memories}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-3}
    volumes:
      - ./agent:/app
    depends_on:
      - qdrant
    networks:
      - oj-net

  redis:
    image: redis:7.4.2-alpine
    container_name: oj-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oj-net
  elasticsearch:
    build:
      context: ./infrastructure/elasticsearch
    image: gojo-elasticsearch-ik:8.11.0
    container_name: oj-search
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - oj-net

  kibana:
    image: kibana:8.11.0
    container_name: oj-kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - oj-net

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: oj-qdrant
    restart: always
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./infrastructure/qdrant/config.yaml:/qdrant/config/config.yaml
    networks:
      - oj-net

networks:
  oj-net:
    driver: bridge

volumes:
  qdrant_storage:
  redis_data:
