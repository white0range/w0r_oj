services:
  frontend:
    image: node:22.16.0-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GOJO_API_PROXY: http://host.docker.internal:8080
    volumes:
      - ./vue:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - oj-net

  mysql:
    image: mysql:8.4.5
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gojo}
      MYSQL_USER: ${MYSQL_USER:-gojo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - oj-net

  redis:
    image: redis:7.4.2-alpine
    container_name: oj-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oj-net
  elasticsearch:
    build:
      context: ./infrastructure/elasticsearch
    image: gojo-elasticsearch-ik:8.11.0
    container_name: oj-search
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - oj-net

  kibana:
    image: kibana:8.11.0
    profiles: ["debug"]
    container_name: oj-kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - oj-net

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: oj-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./infrastructure/qdrant/config.yaml:/qdrant/config/config.yaml
    networks:
      - oj-net

networks:
  oj-net:
    driver: bridge

volumes:
  frontend_node_modules:
  mysql_data:
  qdrant_storage:
  redis_data:
